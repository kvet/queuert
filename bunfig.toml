[install]
# Save dependencies with exact versions (no ^ or ~ range prefixes)
exact = true

# Use isolated node_modules layout instead of hoisting.
# Each package only sees its declared dependencies, preventing phantom deps.
linker = "isolated"

# Only install package versions published at least 1 day ago (in seconds).
# Mitigates supply-chain attacks where a compromised version is pulled from the
# registry shortly after release.
minimumReleaseAge = 86400
