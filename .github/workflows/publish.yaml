name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-repo
        with:
          cache: "false"

      - name: Build packages
        run: pnpm --filter './packages/*' build

      - name: Pack packages
        run: pnpm --filter './packages/*' pack --pack-destination "$RUNNER_TEMP/tarballs"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Stage on npm
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install -g npm@12.2.2 --ignore-scripts # zizmor: ignore[adhoc-packages]

      - name: Stage packages
        run: |
          for tarball in tarballs/*.tgz; do
            npm stage publish "./$tarball" --access public --provenance --ignore-scripts
          done
