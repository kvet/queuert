name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo

      - name: Format check
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  commit-trailers:
    name: Commit Trailers
    runs-on: ubuntu-latest

    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject co-author trailers
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_AFTER -1"
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          offenders=$(git log --format='%h %(trailers:only,unfold,separator=%x20|%x20)' $range | grep -i 'co-authored-by:' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Commits with Co-authored-by trailers are not allowed:"
            echo "$offenders"
            exit 1
          fi

  test:
    needs: [check]

    name: Test
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo

      - name: Test
        run: pnpm test:ci

  examples:
    needs: [check]

    name: Examples
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo

      - name: Examples
        run: pnpm examples

  benchmark-memory-footprint:
    needs: [check]

    name: Benchmark / Memory Footprint
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo

      - name: Memory Footprint
        run: pnpm --filter './benchmarks/memory-footprint' start

  benchmark-processing-capacity:
    needs: [check]

    name: Benchmark / Processing Capacity
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo

      - name: Processing Capacity
        run: pnpm --filter './benchmarks/processing-capacity' start

  benchmark-query-performance:
    needs: [check]

    name: Benchmark / Query Performance
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo

      - name: Query Performance
        run: pnpm --filter './benchmarks/query-performance' start

  benchmark-type-complexity:
    needs: [check]

    name: Benchmark / Type Complexity
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-repo

      - name: Type Complexity
        run: pnpm --filter './benchmarks/type-complexity' start

  # PR CHECKS

  required-collector-job:
    needs:
      [
        check,
        commit-trailers,
        test,
        examples,
        benchmark-memory-footprint,
        benchmark-processing-capacity,
        benchmark-query-performance,
        benchmark-type-complexity,
      ]
    if: github.event_name == 'pull_request' && always()

    name: Required Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "One of the dependent jobs have failed. You may need to re-run it." && exit 1

  # END PR CHECKS
